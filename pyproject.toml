[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "favoriteLinks"
dynamic = ["version"]
description = "This add-on allows you to save, edit and remove links to frequently visited pages"
maintainers = [
	{name = "Edilberto Fonseca", email = "edilberto.fonseca@outlook.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.TXT"}
dependencies = [
	# Build add-on
	"scons==4.10.1",
	"Markdown==3.10",
	# Translations management
	"requests==2.32.5",
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.0.2",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
	# Lint
	"uv==0.11.15",
	"ruff==0.14.5",
	"pre-commit==4.2.0",
	"pyright[nodejs]==1.1.408",
]
[project.urls]
Repository = "https://github.com/EdilbertoFonseca/favoriteLinks"

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
	"lib",
	"lib64",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
	"addon/globalPlugins/favoriteLinks/lib",
	".github/scripts",
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
	"../NVDA/source",
	"../nvda/source"
]

# GENERAL CONFIG & STRICTNESS

# Enable analysis even for functions without type annotations
analyzeUnannotatedFunctions = true

# Warn when using deprecated typing aliases (e.g. Dict, List)
deprecateTypingAliases = true

# Environment configuration
venvPath = ".venv"
venv = "."

# Strictness Settings
strictDictionaryInference = true
strictListInference = true
strictParameterNoneValue = true
strictSetInference = true

# COMPLIANT RULES (ENABLED)

reportAbstractUsage = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true

# Enabled via model (helps catch issues like os.path.join with str|None)
reportCallIssue = true

reportConstantRedefinition = true
reportDuplicateImport = true
reportGeneralTypeIssues = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingModuleSource = true
reportNoOverloadImplementation = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPrivateImportUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUnhashable = true
reportUnnecessaryCast = true
reportUnnecessaryContains = true
reportUnsupportedDunderAll = true
reportUntypedClassDecorator = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportWildcardImportFromLibrary = true

# Unused code & lambdas
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportUnknownLambdaType = true

# Additional checks from your setup
reportUnnecessaryTypeIgnoreComment = true
reportUntypedNamedTuple = true

# DISABLED RULES (NVDA & WXPYTHON WORKAROUNDS)
# Rules sorted and suppressed due to dynamic runtime behavior in NVDA core / wxPython.

# Unclear argument types / wxPython runtime coercion
reportArgumentType = false

# Dynamic attribute access (e.g. gui.mainFrame, addon globals)
reportAttributeAccessIssue = false

# Functions inside default initializers
reportCallInDefaultInitializer = false

# Deprecated Python/NVDA functions
reportDeprecated = false

# Function member access
reportFunctionMemberAccess = false

# NVDA override patterns do not always use explicit @override
reportImplicitOverride = false

# Implicit string concatenation in add-on messages
reportImplicitStringConcatenation = false

# Import cycles in NVDA module structure
reportImportCycles = false

# NVDA Core modules missing type stubs
reportMissingImports = false
reportMissingParameterType = false
reportMissingSuperCall = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false

# Operator and optional member syntax
reportOperatorIssue = false
reportOptionalMemberAccess = false

# Variable assignment & private access
reportPossiblyUnboundVariable = false
reportPrivateUsage = false

# Return types & self/cls conventions
reportReturnType = false
reportSelfClsParameterName = false

# Gettext call bindings (_ = gettext.gettext) and uninitialized instances
reportUndefinedVariable = false
reportUninitializedInstanceVariable = false

# Unknown types coming from NVDA Core / wxPython
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false

# Unnecessary type assertions
reportUnnecessaryComparison = false
reportUnnecessaryIsInstance = false

# Base classes & decorators without typing support
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false

# Call results ignored in wxPython side-effects
reportUnusedCallResult = false


# DEPENDENCY GROUPS (UV)

[dependency-groups]
# Build add-on
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
# Translations management
l10n = [
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.0.2",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
# Lint
lint = [
	"uv==0.11.15",
	"ruff==0.14.5",
	"prek==0.4.8",
	"pyright[nodejs]==1.1.408",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
	{ include-group = "lint" },
]
